[project]
name = "embodied-intelligence-course-api"
version = "0.1.0"
description = "EmbodTeachMS 具身课堂 API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.116.1",
    "pydantic==2.11.7",
    "uvicorn==0.35.0",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
    "python-dotenv==1.1.1",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
